# The panel is mounted rotated 270 degrees and i915 already advertises landscape
# modes for it (kernel arg video=DSI-1:panel_orientation=right_side_up), so mutter
# compensates a second time when the driver also adjusts the orientation. Report the
# raw accelerometer orientation instead: landscape then comes out as transform 0 and
# GNOME's tablet-mode auto-rotation is correct.
[Service]
Environment=MXC6655_NO_PANEL_COMPENSATION=1
